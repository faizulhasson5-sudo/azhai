<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reading - KwordSEO Books</title>
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/style.css">
<style>
  .reader-wrap{max-width:720px;margin:0 auto;padding:24px 20px 80px}
  .reader-back{display:inline-flex;align-items:center;gap:6px;color:var(--text,#fafafa);text-decoration:none;font-size:14px;font-weight:500;padding:8px 0;margin-bottom:16px;opacity:.7;transition:opacity .2s}
  .reader-back:hover{opacity:1}
  .reader-back svg{width:16px;height:16px}
  .reader-title{font-size:1.6rem;font-weight:700;margin-bottom:4px;line-height:1.3}
  .reader-author{font-size:.95rem;color:var(--text,#fafafa);opacity:.6;margin-bottom:24px}
  .reader-loading{text-align:center;padding:80px 20px;color:var(--text,#fafafa);opacity:.5}
  .reader-loading .spinner{width:32px;height:32px;border:3px solid var(--border,#262626);border-top-color:#2563eb;border-radius:50%;animation:spin .6s linear infinite;margin:0 auto 16px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .reader-content{white-space:pre-wrap;word-wrap:break-word;font-size:1.05rem;line-height:1.85;color:var(--text,#fafafa);font-family:'DM Sans',sans-serif}
  .reader-content p{margin-bottom:1em;text-indent:0}
  .reader-error{text-align:center;padding:80px 20px}
  .reader-error h2{font-size:1.3rem;margin-bottom:8px}
  .reader-error p{color:var(--text,#fafafa);opacity:.6;margin-bottom:20px}
  .reader-error a{color:#2563eb;text-decoration:underline}
  .reader-nav{display:flex;justify-content:space-between;align-items:center;padding:20px 0;border-top:1px solid var(--border,#262626);margin-top:40px}
  .reader-nav a{color:#2563eb;text-decoration:none;font-size:14px;font-weight:500}
  .reader-nav a:hover{text-decoration:underline}
  .reader-progress{position:fixed;top:0;left:0;height:3px;background:#2563eb;z-index:10000;transition:width .1s}
</style>
</head>
<body>
  <div class="reader-progress" id="progress" style="width:0"></div>

  <div class="reader-wrap">
    <a href="/books/" class="reader-back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Back to Books
    </a>

    <h1 class="reader-title" id="bookTitle">Loading...</h1>
    <p class="reader-author" id="bookAuthor"></p>

    <div class="reader-loading" id="loader">
      <div class="spinner"></div>
      <p>Fetching book content...</p>
    </div>

    <div class="reader-error" id="error" style="display:none">
      <h2>Could not load book</h2>
      <p id="errorMsg">This book may not be available for in-page reading.</p>
      <a id="externalLink" href="#" target="_blank" rel="noopener">Open in original source â†’</a>
      <br><br>
      <a href="/books/" style="color:#2563eb">â† Back to Books</a>
    </div>

    <div class="reader-content" id="content" style="display:none"></div>

    <div class="reader-nav" id="nav" style="display:none">
      <a href="/books/">â† More Books</a>
      <a href="#" id="externalBtn" target="_blank" rel="noopener">View Original â†’</a>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
  (function(){
    var params=new URLSearchParams(window.location.search);
    var bookUrl=params.get('url')||'';
    var bookTitle=decodeURIComponent(params.get('title')||'Unknown');
    var bookAuthor=decodeURIComponent(params.get('author')||'');
    var bookGenre=decodeURIComponent(params.get('genre')||'');

    document.getElementById('bookTitle').textContent=bookTitle;
    document.getElementById('bookAuthor').textContent=bookAuthor?(bookAuthor+(bookGenre?' Â· '+bookGenre:'')):(bookGenre||'');
    document.title=bookTitle+' - Reading - KwordSEO Books';
    document.getElementById('externalLink').href=bookUrl;
    document.getElementById('externalBtn').href=bookUrl;

    if(!bookUrl){
      showError('No book URL provided.');
      return;
    }

    // Try to extract Gutenberg ID and get plain text
    var gutenbergMatch=bookUrl.match(/gutenberg\.org\/(?:files\/(\d+)|ebooks\/(\d+))/);
    if(gutenbergMatch){
      var id=gutenbergMatch[1]||gutenbergMatch[2];
      var txtUrl='https://www.gutenberg.org/cache/epub/'+id+'/pg'+id+'.txt';
      fetchBook(txtUrl, id);
    } else {
      // For non-Gutenberg books, try to open externally
      showError('This book is hosted externally and cannot be loaded here.');
      document.getElementById('externalLink').style.display='inline-block';
    }

    function fetchBook(url, id){
      fetch(url).then(function(r){
        if(!r.ok) throw new Error('HTTP '+r.status);
        return r.text();
      }).then(function(text){
        document.getElementById('loader').style.display='none';
        document.getElementById('content').style.display='block';
        document.getElementById('nav').style.display='flex';

        // Clean up Gutenberg header/footer
        var lines=text.split('\n');
        var start=0,end=lines.length;
        for(var i=0;i<lines.length;i++){
          if(lines[i].match(/^\*\*\* START OF (THIS|THE) PROJECT GUTENBERG/i)){
            start=i+1;break;
          }
        }
        for(var i=lines.length-1;i>=0;i--){
          if(lines[i].match(/^\*\*\* END OF (THIS|THE) PROJECT GUTENBERG/i)){
            end=i;break;
          }
        }
        if(start>0||end<lines.length){
          lines=lines.slice(start,end);
        }

        // Convert to HTML paragraphs
        var html='';
        var inPara=false;
        for(var i=0;i<lines.length;i++){
          var line=lines[i].replace(/\r/g,'');
          if(line.trim()===''){
            if(inPara){html+='</p>';inPara=false;}
          } else {
            if(!inPara){html+='<p>';inPara=true;}
            else{html+='<br>';}
            html+=escHtml(line);
          }
        }
        if(inPara)html+='</p>';
        document.getElementById('content').innerHTML=html;
      }).catch(function(e){
        showError('Failed to load book content: '+e.message);
      });
    }

    function showError(msg){
      document.getElementById('loader').style.display='none';
      document.getElementById('error').style.display='block';
      document.getElementById('errorMsg').textContent=msg;
    }

    function escHtml(s){
      var d=document.createElement('div');
      d.textContent=s;
      return d.innerHTML;
    }

    // Reading progress bar
    window.addEventListener('scroll',function(){
      var h=document.documentElement;
      var pct=(h.scrollTop)/(h.scrollHeight-h.clientHeight)*100;
      document.getElementById('progress').style.width=Math.min(100,Math.max(0,pct))+'%';
    });
  })();
  </script>
</body>
</html>
